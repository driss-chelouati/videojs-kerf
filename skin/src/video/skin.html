<media-container class="media-skin kerf" data-theme="kerf" data-preset="video">
<!-- Add a compatible media component here. -->
<media-poster class="kerf-poster">
<img alt="" decoding="async" class="kerf-poster-image">
</media-poster>

<media-error-dialog>
<media-dialog-backdrop class="kerf-error-backdrop"></media-dialog-backdrop>
<media-dialog-popup class="kerf-error kerf-notch">
<media-dialog-title class="kerf-error-title"></media-dialog-title>
<media-dialog-description class="kerf-error-text"></media-dialog-description>
<media-dialog-close class="kerf-error-close"></media-dialog-close>
</media-dialog-popup>
</media-error-dialog>

<media-controls>
<media-buffering-indicator class="kerf-tile kerf-buffering">
<media-icon family="kerf" name="spinner" class="kerf-tile-icon"></media-icon>
</media-buffering-indicator>

<media-controls-content class="kerf-ui">
<media-tooltip-group>

<media-play-button class="kerf-tile kerf-start" id="kerf-start">
<media-icon family="kerf" name="play" class="kerf-tile-icon kerf-play-icon"></media-icon>
</media-play-button>

<div class="kerf-timetab kerf-notch" aria-hidden="true">
<media-time-group class="kerf-time">
<media-time class="kerf-time-current" type="current"></media-time>
<media-time-separator class="kerf-time-separator"></media-time-separator>
<media-time class="kerf-time-duration" type="duration"></media-time>
</media-time-group>
</div>

<media-controls-group class="kerf-band">

<media-play-button class="kerf-button kerf-play" id="kerf-play">
<media-icon family="kerf" name="restart" class="kerf-icon kerf-restart-icon"></media-icon>
<media-icon family="kerf" name="play" class="kerf-icon kerf-play-icon"></media-icon>
<media-icon family="kerf" name="pause" class="kerf-icon kerf-pause-icon"></media-icon>
</media-play-button>
<media-tooltip id="kerf-tip-play" trigger="kerf-play" side="top" class="kerf-popup kerf-tip kerf-notch">
<media-tooltip-label></media-tooltip-label>
<media-tooltip-shortcut class="kerf-kbd"></media-tooltip-shortcut>
</media-tooltip>

<media-time-slider class="kerf-seek" thumb-alignment="center">
<media-time-slider-chapters class="kerf-chapters">
<template>
<div class="kerf-chapter">
<media-slider-track class="kerf-track">
<media-slider-buffer class="kerf-buffer"></media-slider-buffer>
<media-slider-fill class="kerf-fill"></media-slider-fill>
</media-slider-track>
</div>
</template>
</media-time-slider-chapters>
<media-slider-thumb class="kerf-blade"></media-slider-thumb>
<media-slider-preview class="kerf-preview kerf-notch">
<media-slider-thumbnail class="kerf-preview-frame">
<img alt="" aria-hidden="true" decoding="async" class="kerf-preview-image">
</media-slider-thumbnail>
<div class="kerf-preview-meta">
<media-time-slider-chapter-title class="kerf-preview-chapter"></media-time-slider-chapter-title>
<media-slider-value class="kerf-preview-time" type="pointer"></media-slider-value>
</div>
</media-slider-preview>
</media-time-slider>

<media-mute-button commandfor="kerf-volume" class="kerf-button kerf-mute" id="kerf-mute">
<media-icon family="kerf" name="volume-off" class="kerf-icon kerf-volume-off-icon"></media-icon>
<media-icon family="kerf" name="volume-low" class="kerf-icon kerf-volume-low-icon"></media-icon>
<media-icon family="kerf" name="volume-high" class="kerf-icon kerf-volume-high-icon"></media-icon>
</media-mute-button>
<media-tooltip id="kerf-tip-mute" trigger="kerf-mute" delay="0" disabled side="top" sticky class="kerf-popup kerf-tip kerf-notch">
<media-tooltip-label></media-tooltip-label>
<media-tooltip-shortcut class="kerf-kbd"></media-tooltip-shortcut>
</media-tooltip>
<media-volume-popover open-on-hover delay="200" close-delay="100" side="top" class="kerf-popup kerf-volume kerf-notch" id="kerf-volume">
<media-volume-slider class="kerf-volume-slider" orientation="vertical" thumb-alignment="edge">
<media-slider-track class="kerf-volume-track">
<media-slider-fill class="kerf-volume-fill"></media-slider-fill>
</media-slider-track>
<media-slider-thumb class="kerf-volume-blade"></media-slider-thumb>
</media-volume-slider>
</media-volume-popover>

<media-captions-button class="kerf-button kerf-captions" id="kerf-captions">
<media-icon family="kerf" name="captions-off" class="kerf-icon kerf-captions-off-icon"></media-icon>
<media-icon family="kerf" name="captions-on" class="kerf-icon kerf-captions-on-icon"></media-icon>
</media-captions-button>
<media-tooltip id="kerf-tip-captions" trigger="kerf-captions" side="top" class="kerf-popup kerf-tip kerf-notch">
<media-tooltip-label></media-tooltip-label>
<media-tooltip-shortcut class="kerf-kbd"></media-tooltip-shortcut>
</media-tooltip>

<button commandfor="kerf-settings" class="kerf-button kerf-gear" id="kerf-gear">
<media-icon family="kerf" name="gear" class="kerf-icon"></media-icon>
<media-text class="kerf-sr" token="menu.settings">Settings</media-text>
</button>
<media-tooltip id="kerf-tip-gear" trigger="kerf-gear" side="top" class="kerf-popup kerf-tip kerf-notch">
<media-text token="menu.settings">Settings</media-text>
</media-tooltip>
<media-menu side="top" align="end" class="kerf-popup kerf-menu kerf-notch" id="kerf-settings">
<media-menu-content class="kerf-menu-page">
<media-menu-item commandfor="kerf-menu-speed" class="kerf-menu-item">
<media-icon family="kerf" name="speed" class="kerf-menu-icon"></media-icon>
<media-text token="menu.speed">Speed</media-text>
<span class="kerf-menu-hint"><span data-part="value"></span></span>
<media-icon family="kerf" name="chevron" class="kerf-menu-chevron"></media-icon>
</media-menu-item>
<media-menu-item commandfor="kerf-menu-captions" class="kerf-menu-item">
<media-icon family="kerf" name="captions-on" class="kerf-menu-icon"></media-icon>
<media-text token="menu.captions">Captions</media-text>
<span class="kerf-menu-hint"><span data-part="value"></span></span>
<media-icon family="kerf" name="chevron" class="kerf-menu-chevron"></media-icon>
</media-menu-item>
<media-menu-item commandfor="kerf-menu-quality" class="kerf-menu-item">
<media-icon family="kerf" name="quality" class="kerf-menu-icon"></media-icon>
<media-text token="menu.quality">Quality</media-text>
<span class="kerf-menu-hint"><span data-part="value"></span></span>
<media-icon family="kerf" name="chevron" class="kerf-menu-chevron"></media-icon>
</media-menu-item>
</media-menu-content>

<media-menu-content class="kerf-menu-page" id="kerf-menu-speed">
<media-menu-item class="kerf-menu-back">
<media-icon family="kerf" name="chevron" class="kerf-menu-back-icon"></media-icon>
<media-text token="menu.speed">Speed</media-text>
</media-menu-item>
<media-playback-rate-radio-group class="kerf-rates" rates="0.5 0.75 1 1.25 1.5 2">
<template>
<media-menu-radio-item class="kerf-rate">
<span data-part="label"></span>
</media-menu-radio-item>
</template>
</media-playback-rate-radio-group>
</media-menu-content>

<media-menu-content class="kerf-menu-page" id="kerf-menu-captions">
<media-menu-item class="kerf-menu-back">
<media-icon family="kerf" name="chevron" class="kerf-menu-back-icon"></media-icon>
<media-text token="menu.captions">Captions</media-text>
</media-menu-item>
<media-captions-radio-group class="kerf-options">
<template>
<media-menu-radio-item class="kerf-menu-item kerf-option">
<span data-part="label"></span>
<span data-part="badge" class="kerf-menu-badge"></span>
<media-menu-item-indicator force-mount class="kerf-check">
<media-icon family="kerf" name="check"></media-icon>
</media-menu-item-indicator>
</media-menu-radio-item>
</template>
</media-captions-radio-group>
</media-menu-content>

<media-menu-content class="kerf-menu-page" id="kerf-menu-quality">
<media-menu-item class="kerf-menu-back">
<media-icon family="kerf" name="chevron" class="kerf-menu-back-icon"></media-icon>
<media-text token="menu.quality">Quality</media-text>
</media-menu-item>
<media-quality-radio-group class="kerf-options">
<template>
<media-menu-radio-item class="kerf-menu-item kerf-option">
<span><span data-part="label"></span><sup data-part="tier" class="kerf-menu-tier"></sup></span>
<span data-part="badge" class="kerf-menu-badge"></span>
<media-menu-item-indicator force-mount class="kerf-check">
<media-icon family="kerf" name="check"></media-icon>
</media-menu-item-indicator>
</media-menu-radio-item>
</template>
</media-quality-radio-group>
</media-menu-content>
</media-menu>

<media-fullscreen-button class="kerf-button kerf-fullscreen" id="kerf-fullscreen">
<media-icon family="kerf" name="fullscreen-enter" class="kerf-icon kerf-fullscreen-enter-icon"></media-icon>
<media-icon family="kerf" name="fullscreen-exit" class="kerf-icon kerf-fullscreen-exit-icon"></media-icon>
</media-fullscreen-button>
<media-tooltip id="kerf-tip-fullscreen" trigger="kerf-fullscreen" side="top" class="kerf-popup kerf-tip kerf-notch">
<media-tooltip-label></media-tooltip-label>
<media-tooltip-shortcut class="kerf-kbd"></media-tooltip-shortcut>
</media-tooltip>

</media-controls-group>
</media-tooltip-group>
</media-controls-content>
</media-controls>

<media-hotkey keys="Space" action="togglePaused"></media-hotkey>
<media-hotkey keys="k" action="togglePaused"></media-hotkey>
<media-hotkey keys="m" action="toggleMuted"></media-hotkey>
<media-hotkey keys="ArrowRight" action="seekStep"></media-hotkey>
<media-hotkey keys="ArrowLeft" action="seekStep"></media-hotkey>
<media-hotkey keys="l" action="seekStep"></media-hotkey>
<media-hotkey keys="j" action="seekStep"></media-hotkey>
<media-hotkey keys="ArrowUp" action="volumeStep"></media-hotkey>
<media-hotkey keys="ArrowDown" action="volumeStep"></media-hotkey>
<media-hotkey keys="0-9" action="seekToPercent"></media-hotkey>
<media-hotkey keys="Home" action="seekToPercent" value="0"></media-hotkey>
<media-hotkey keys="End" action="seekToPercent" value="100"></media-hotkey>
<media-hotkey keys=">" action="speedUp"></media-hotkey>
<media-hotkey keys="<" action="speedDown"></media-hotkey>
<media-hotkey keys="f" action="toggleFullscreen"></media-hotkey>
<media-hotkey keys="c" action="toggleSubtitles"></media-hotkey>
<media-gesture type="tap" action="togglePaused" pointer="mouse" region="center"></media-gesture>
<media-gesture type="tap" action="toggleControls" pointer="touch"></media-gesture>
<media-gesture type="doubletap" action="seekStep" region="left"></media-gesture>
<media-gesture type="doubletap" action="toggleFullscreen" region="center"></media-gesture>
<media-gesture type="doubletap" action="seekStep" region="right"></media-gesture>
<media-status-announcer class="kerf-sr"></media-status-announcer>

<div aria-hidden="true" class="kerf-status">
<media-volume-indicator class="kerf-indicator kerf-notch">
<media-icon family="kerf" name="volume-high" class="kerf-indicator-icon kerf-volume-high-icon"></media-icon>
<media-icon family="kerf" name="volume-low" class="kerf-indicator-icon kerf-volume-low-icon"></media-icon>
<media-icon family="kerf" name="volume-off" class="kerf-indicator-icon kerf-volume-off-icon"></media-icon>
<media-volume-indicator-value class="kerf-indicator-value"></media-volume-indicator-value>
</media-volume-indicator>
<media-status-indicator actions="toggleSubtitles,toggleFullscreen" class="kerf-indicator kerf-notch">
<media-icon family="kerf" name="captions-on" class="kerf-indicator-icon kerf-status-captions-on"></media-icon>
<media-icon family="kerf" name="captions-off" class="kerf-indicator-icon kerf-status-captions-off"></media-icon>
<media-icon family="kerf" name="fullscreen-enter" class="kerf-indicator-icon kerf-status-fullscreen"></media-icon>
<media-icon family="kerf" name="fullscreen-exit" class="kerf-indicator-icon kerf-status-exit-fullscreen"></media-icon>
<media-status-indicator-value class="kerf-indicator-value"></media-status-indicator-value>
</media-status-indicator>
<media-seek-indicator class="kerf-indicator kerf-notch">
<media-icon family="kerf" name="seek" class="kerf-indicator-icon kerf-seek-icon"></media-icon>
<media-seek-indicator-value class="kerf-indicator-value"></media-seek-indicator-value>
</media-seek-indicator>
</div>

<div class="kerf-rail" aria-hidden="true"></div>
</media-container>
